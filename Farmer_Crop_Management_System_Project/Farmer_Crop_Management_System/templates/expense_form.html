{% extends "base.html" %}
{% block title %}Edit Expense - Namma Krushi{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="cardbox">
        <h2 data-en="Edit Farm Expense"
            data-kn="ಕೃಷಿ ವೆಚ್ಚವನ್ನು ಸಂಪಾದಿಸಿ">
            Edit Farm Expense
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label"
                       data-en="Select Crop"
                       data-kn="ಬೆಳೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ">
                    Select Crop
                </label>

                <select name="crop_id" class="form-select" required>
                    {% for crop in crops %}
                    <option value="{{ crop.id }}"
                        {% if crop.id == expense.crop_id %}selected{% endif %}>
                        {{ crop.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label"
                       data-en="Expense Category"
                       data-kn="ವೆಚ್ಚದ ವರ್ಗ">
                    Expense Category
                </label>

                <select name="category" class="form-select" required>
                    {% for category in categories %}
                    <option value="{{ category }}"
                        {% if category == expense.category %}selected{% endif %}>
                        {{ category }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label"
                       data-en="Amount (₹)"
                       data-kn="ಮೊತ್ತ (₹)">
                    Amount (₹)
                </label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       step="0.01"
                       min="0.01"
                       value="{{ expense.amount }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label"
                       data-en="Expense Date"
                       data-kn="ವೆಚ್ಚದ ದಿನಾಂಕ">
                    Expense Date
                </label>

                <input type="date"
                       name="expense_date"
                       class="form-control"
                       value="{{ expense.expense_date.isoformat() if expense.expense_date else '' }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label"
                       data-en="Description"
                       data-kn="ವಿವರಣೆ">
                    Description
                </label>

                <textarea name="description"
                          class="form-control"
                          rows="3">{{ expense.description or '' }}</textarea>
            </div>

            <button type="submit"
                    class="btn btn-success"
                    data-en="Update Expense"
                    data-kn="ವೆಚ್ಚವನ್ನು ನವೀಕರಿಸಿ">
                Update Expense
            </button>

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-secondary"
               data-en="Cancel"
               data-kn="ರದ್ದುಮಾಡಿ">
                Cancel
            </a>

        </form>
    </div>

</div>
{% endblock %}
